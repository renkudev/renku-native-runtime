name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version tag, for example 0.1.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: native-runtime-release
  cancel-in-progress: false

env:
  BUILD_TYPE: Release
  HERMES_APPLE_ARCHITECTURES: "arm64"
  HERMES_BUILD_LEAN_LIBHERMES: "true"
  HERMES_REVISION: efcf68e285865fd9d952070b08e751bcad63f25e

jobs:
  build-slice:
    name: Build ${{ matrix.platform }}
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        platform:
          - macosx
          - iphoneos
          - iphonesimulator

    steps:
      - name: Check out the package
        uses: actions/checkout@v7
        with:
          path: package

      - name: Check out Hermes
        uses: actions/checkout@v7
        with:
          repository: facebook/hermes
          ref: ${{ env.HERMES_REVISION }}
          path: hermes

      - name: Configure the runtime-only arm64 build
        run: git -C hermes apply "$GITHUB_WORKSPACE/package/Support/hermes-runtime.patch"

      - name: Report the build environment
        run: |
          xcodebuild -version
          cmake --version
          swift --version
          test "$(uname -m)" = "arm64"
          test "$HERMES_APPLE_ARCHITECTURES" = "arm64"
          test "$HERMES_BUILD_LEAN_LIBHERMES" = "true"

      - name: Build the host compiler
        working-directory: hermes
        run: ./utils/build-apple-framework.sh build_hermesc

      - name: Archive the host compiler
        if: matrix.platform == 'macosx'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          compiler="hermes/build_host_hermesc/bin/hermesc"
          test -x "$compiler"
          "$compiler" -version

          bundle="$RUNNER_TEMP/hermesc-macos-arm64"
          mkdir -p "$bundle/bin"
          cp "$compiler" "$bundle/bin/hermesc"
          cp hermes/LICENSE "$bundle/LICENSE-HERMES"
          printf \
            '{"repository":"https://github.com/facebook/hermes","revision":"%s","release":"%s"}\n' \
            "$HERMES_REVISION" \
            "$VERSION" \
            > "$bundle/SOURCE.json"
          tar -czf "$RUNNER_TEMP/hermesc-macos-arm64.tar.gz" -C "$bundle" .

      - name: Upload the host compiler
        if: matrix.platform == 'macosx'
        uses: actions/upload-artifact@v7
        with:
          name: hermesc-macos-arm64
          path: ${{ runner.temp }}/hermesc-macos-arm64.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Build the runtime slice
        working-directory: hermes
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          case "$PLATFORM" in
            macosx)
              export MAC_DEPLOYMENT_TARGET=27.0
              ;;
            iphoneos|iphonesimulator)
              export IOS_DEPLOYMENT_TARGET=27.0
              ;;
          esac
          ./utils/build-apple-framework.sh "$PLATFORM"
          grep -Eq \
            '^HERMES_BUILD_LEAN_LIBHERMES:[^=]+=true$' \
            "build_$PLATFORM/CMakeCache.txt"
          grep -q \
            '^CMAKE_OSX_ARCHITECTURES:STRING=arm64$' \
            "build_$PLATFORM/CMakeCache.txt"

      - name: Preserve framework symlinks
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          tar -czf "$RUNNER_TEMP/$PLATFORM.tar.gz" \
            -C "hermes/build_$PLATFORM/lib" \
            hermesvm.framework

      - name: Upload the slice
        uses: actions/upload-artifact@v7
        with:
          name: runtime-${{ matrix.platform }}
          path: ${{ runner.temp }}/${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    name: Assemble and publish
    needs: build-slice
    runs-on: xcode-27

    steps:
      - name: Check out the package
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be a stable semantic version such as 0.1.0"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION"; then
            echo "Tag $VERSION already exists"
            exit 1
          fi

      - name: Check out Hermes headers
        uses: actions/checkout@v7
        with:
          repository: facebook/hermes
          ref: ${{ env.HERMES_REVISION }}
          path: hermes

      - name: Download runtime slices
        uses: actions/download-artifact@v8
        with:
          pattern: runtime-*
          path: slices

      - name: Download the arm64 macOS compiler
        uses: actions/download-artifact@v8
        with:
          name: hermesc-macos-arm64
          path: compiler

      - name: Restore runtime slices
        run: |
          for archive in slices/*/*.tar.gz; do
            platform=$(basename "$archive" .tar.gz)
            destination="hermes/destroot/Library/Frameworks/$platform"
            mkdir -p "$destination"
            tar -xzf "$archive" -C "$destination"
          done

      - name: Add public headers and module metadata
        run: |
          for framework in hermes/destroot/Library/Frameworks/*/hermesvm.framework; do
            if [[ -d "$framework/Versions" ]]; then
              version_directory=$(find "$framework/Versions" -mindepth 1 -maxdepth 1 -type d | head -1)
              headers="$version_directory/Headers"
              modules="$version_directory/Modules"
              mkdir -p "$headers/hermes/Public" "$headers/hermes/cdp" "$headers/jsi" "$modules"
              [[ -e "$framework/Headers" ]] || ln -s Versions/Current/Headers "$framework/Headers"
              [[ -e "$framework/Modules" ]] || ln -s Versions/Current/Modules "$framework/Modules"
            else
              headers="$framework/Headers"
              modules="$framework/Modules"
              mkdir -p "$headers/hermes/Public" "$headers/hermes/cdp" "$headers/jsi" "$modules"
            fi

            cp hermes/API/hermes/*.h "$headers/hermes/"
            cp hermes/API/hermes/cdp/*.h "$headers/hermes/cdp/"
            cp hermes/public/hermes/Public/*.h "$headers/hermes/Public/"
            cp hermes/API/jsi/jsi/*.h "$headers/jsi/"
            cp Support/hermesvm.modulemap "$modules/module.modulemap"
          done

      - name: Assemble the XCFramework
        working-directory: hermes
        run: |
          mkdir -p destroot/Library/Frameworks/universal
          xcodebuild -create-xcframework \
            -framework destroot/Library/Frameworks/macosx/hermesvm.framework \
            -framework destroot/Library/Frameworks/iphoneos/hermesvm.framework \
            -framework destroot/Library/Frameworks/iphonesimulator/hermesvm.framework \
            -output destroot/Library/Frameworks/universal/hermesvm.xcframework

          xcframework=destroot/Library/Frameworks/universal/hermesvm.xcframework
          test "$(find "$xcframework" -type f -name hermesvm | wc -l | tr -d ' ')" = "3"
          while IFS= read -r binary; do
            test "$(lipo -archs "$binary")" = "arm64"
          done < <(find "$xcframework" -type f -name hermesvm)

      - name: Archive the newly built XCFramework
        run: |
          mkdir -p Artifacts
          cp -R \
            hermes/destroot/Library/Frameworks/universal/hermesvm.xcframework \
            Artifacts/hermesvm.xcframework
          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            Artifacts/hermesvm.xcframework \
            "$RUNNER_TEMP/hermesvm.xcframework.zip"

      - name: Validate and checksum the host compiler
        run: |
          archive="compiler/hermesc-macos-arm64.tar.gz"
          directory="$RUNNER_TEMP/hermesc-validation"
          mkdir -p "$directory"
          tar -xzf "$archive" -C "$directory"
          test -x "$directory/bin/hermesc"
          [[ "$(file "$directory/bin/hermesc")" == *"arm64"* ]]
          "$directory/bin/hermesc" -version
          grep -q "\"revision\":\"$HERMES_REVISION\"" "$directory/SOURCE.json"

          checksum=$(shasum -a 256 "$archive" | cut -d ' ' -f 1)
          printf '%s  %s\n' "$checksum" "hermesc-macos-arm64.tar.gz" \
            > "compiler/hermesc-macos-arm64.tar.gz.sha256"
          echo "HERMESC=$directory/bin/hermesc" >> "$GITHUB_ENV"
          echo "hermesc macOS arm64 SHA-256: \`$checksum\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate the Swift package
        run: |
          "$HERMESC" \
            -emit-binary \
            -out Sources/RenkuNativeRuntimeProbe/Fixtures/runtime.hbc \
            Sources/RenkuNativeRuntimeProbe/Fixtures/runtime.js
          RENKU_NATIVE_LOCAL_XCFRAMEWORK=Artifacts/hermesvm.xcframework \
            swift build --product RenkuNativeRuntimeProbe

          for destination in \
            "generic/platform=macOS" \
            "generic/platform=iOS" \
            "generic/platform=iOS Simulator"; do
            RENKU_NATIVE_LOCAL_XCFRAMEWORK=Artifacts/hermesvm.xcframework \
              xcodebuild \
                -quiet \
                -scheme RenkuNativeRuntime \
                -destination "$destination" \
                -derivedDataPath DerivedData \
                CODE_SIGNING_ALLOWED=NO \
                build
          done

      - name: Checksum the XCFramework
        run: |
          checksum=$(swift package compute-checksum "$RUNNER_TEMP/hermesvm.xcframework.zip")
          echo "CHECKSUM=$checksum" >> "$GITHUB_ENV"
          echo "XCFramework checksum: \`$checksum\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Pin the release in Package.swift
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sed -E -i '' \
            "s#/releases/download/[^/]+/#/releases/download/$VERSION/#" \
            Package.swift
          sed -E -i '' \
            "s/checksum: \"[0-9a-f]{64}\"/checksum: \"$CHECKSUM\"/" \
            Package.swift
          swift package dump-package > /dev/null
          git diff --check

      - name: Commit and tag the release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Package.swift
          git commit -m "Release $VERSION"
          git tag "$VERSION"
          git push origin HEAD:main
          git push origin "$VERSION"

      - name: Publish the immutable binary
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "$VERSION" \
            "$RUNNER_TEMP/hermesvm.xcframework.zip" \
            compiler/hermesc-macos-arm64.tar.gz \
            compiler/hermesc-macos-arm64.tar.gz.sha256 \
            LICENSE-HERMES \
            --title "$VERSION" \
            --generate-notes
